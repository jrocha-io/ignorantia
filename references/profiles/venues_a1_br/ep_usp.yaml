taxonomy:
  review_types_accepted:
    - systematic_review_strict
    - systematic_review_with_2_reviewers
    - scoping_review
    - narrative_review
    - mapping_study
  reporting_guidelines_endorsed:
    - PRISMA-2020
    - PRISMA-ScR
  methodological_standards_endorsed:
    - ICMJE
    - COPE

hard_requirements:
  length:
    unit: characters_with_spaces
    min: 35000
    max: 50000
    excludes: [abstract]
  abstract:
    max_words: 250
    min_words: 200
    structured: false
  title:
    max_words: 16
  keywords:
    min: 3
    max: 5
    controlled_vocabulary: Thesaurus-BR-Educacao
  citation_style:
    format: abnt-nbr-6023
    references_max: null
  mandatory_sections:
    - Introdução
    - Metodologia
    - Resultados
    - Discussão
    - Considerações Finais
    - Referências
  mandatory_declarations:
    - id: conflicts_of_interest
      severity: blocking
    - id: funding
      severity: blocking
    - id: orcid_all_authors
      severity: blocking
    - id: ai_usage
      severity: blocking
    - id: ethics_approval
      severity: major
    - id: data_availability
      severity: major
  file_format:
    accepted: [docx, doc]
  figures:
    max_count: null
  authorship:
    icmje_required: false
    orcid_required: all
    credit_taxonomy_required: false
  registration:
    prospero_required: false
    osf_acceptable: true

soft_signals:
  scope_keywords:
    - educação
    - pedagogia
    - políticas educacionais
    - formação de professores
    - práticas pedagógicas
    - currículo
    - aprendizagem
    - ensino
    - alfabetização
  out_of_scope_keywords:
    - clinical medicine
    - software engineering only
    - laboratory science

scope:
  thesaurus_descriptors:
    - "Educação"
    - "Pedagogia"
    - "Formação de Professores"
    - "Currículo"
  areas_qualis:
    - "Educação (área 38)"
  excluded_topics:
    - hard sciences without educational context
