taxonomy:
  review_types_accepted:
    - systematic_review_strict
    - mapping_study
    - scoping_review
  reporting_guidelines_endorsed:
    - PRISMA-2020
    - SIGSOFT-EMP-STANDARDS
  methodological_standards_endorsed:
    - ICMJE
    - COPE

hard_requirements:
  length:
    unit: words
    max: 10000
    min: 6000
    excludes: [abstract, references]
  abstract:
    max_words: 250
    structured: false
  title:
    max_words: 18
  keywords:
    min: 4
    max: 6
    controlled_vocabulary: ACM-CCS-2012
  citation_style:
    format: apa-7
    references_max: null
  mandatory_sections:
    - Introduction
    - Theoretical Background
    - Methods
    - Results
    - Discussion
    - Conclusion
    - References
  mandatory_declarations:
    - id: conflicts_of_interest
      severity: blocking
    - id: funding
      severity: blocking
    - id: ai_usage
      severity: major
    - id: orcid_all_authors
      severity: major
  file_format:
    accepted: [docx, doc]
  authorship:
    icmje_required: false
    orcid_required: all
    credit_taxonomy_required: false
  registration:
    prospero_required: false
    osf_acceptable: true

soft_signals:
  scope_keywords:
    - information systems
    - technology management
    - IT governance
    - digital transformation
    - business intelligence
    - sistemas de informação
    - gestão da tecnologia

scope:
  thesaurus_descriptors:
