  notes: |
    Brazilian Journal of Probability and Statistics (BJPS) é periódico oficial da ABE,
    co-publicado pelo Institute of Mathematical Statistics (IMS, EUA).
    Qualis A2 PROVÁVEL em Matemática/Probabilidade e Estatística no 2021-2024.
    Confirmação Sucupira por ISSN 0103-0752 mandatória.
    SUBSCRIPTION model (não OA): autor não paga APC mas leitor paga subscription.
    Tier-3 do esquema OA-first: pior cenário OA (acesso restrito a assinantes/instituições).
    Listado APENAS como FALLBACK para casos onde leitor institucional é aceitável.
    Aceita survey papers em probabilidade e estatística teórica.
    Inglês obrigatório.

