metadata:
  venue_id: nejm
  name: "New England Journal of Medicine"
  publisher: "Massachusetts Medical Society"
  country: US
  language_acceptance: [en]
  qualis_stratum: null
  qualis_subarea: null
  jcr_quartile: Q1
  sjr_quartile: Q1
  doaj_indexed: false
  scielo_indexed: false
  open_access: hybrid
  submission_system: nejm_native
  source_url: "https://www.nejm.org/author-center/manuscript-submission"
  archived_url: "https://web.archive.org/web/2026/https://www.nejm.org/author-center/manuscript-submission"
  profile_version: "1.0.0"
  last_verified: "2026-05-02"
  last_verified_by: "ignorantia-engine"

taxonomy:
  review_types_accepted:
    - systematic_review_strict
    - meta_analysis
  reporting_guidelines_endorsed:
    - PRISMA-2020
    - PRISMA-S
    - CONSORT-2010
    - STARD-2015
    - STROBE
  methodological_standards_endorsed:
    - ICMJE
    - COPE

hard_requirements:
  length:
    unit: words
    max: 2700
    excludes: [abstract, references, tables, figures]
  abstract:
    max_words: 250
    structured: true
    structure_headings: [Background, Methods, Results, Conclusions]
  title:
    max_words: 14
  keywords:
    min: 0
    max: 0
    controlled_vocabulary: null
  citation_style:
    format: vancouver_superscript
    references_max: 40
  mandatory_sections:
    - Introduction
    - Methods
    - Results
    - Discussion
    - References
  mandatory_declarations:
    - id: trial_registration
      severity: blocking
    - id: ethics_approval
      severity: blocking
    - id: conflicts_of_interest
      severity: blocking
    - id: funding
      severity: blocking
    - id: ai_usage
      severity: blocking
    - id: data_availability
      severity: blocking
    - id: prospero_registration
      severity: blocking
  file_format:
    accepted: [docx]
  figures:
    max_count: 5
  authorship:
    icmje_required: true
    orcid_required: all
    credit_taxonomy_required: true
  registration:
    prospero_required: true
    osf_acceptable: false

soft_signals:
  scope_keywords:
    - clinical medicine
    - randomized controlled trial
    - meta-analysis
    - clinical guidelines
    - high-impact health
  out_of_scope_keywords:
    - basic science only
    - non-clinical

scope:
  thesaurus_descriptors:
    - "Medicine [MeSH]"
    - "Clinical Medicine [MeSH]"
