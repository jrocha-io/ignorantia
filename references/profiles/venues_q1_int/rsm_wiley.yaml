metadata:
  venue_id: rsm_wiley
  name: "Research Synthesis Methods"
  publisher: "Wiley"
  country: US
  language_acceptance: [en]
  qualis_stratum: null
  jcr_quartile: Q1
  sjr_quartile: Q1
  open_access: hybrid
  submission_system: scholarone
  source_url: "https://onlinelibrary.wiley.com/page/journal/17592887/homepage/forauthors.html"
  archived_url: "https://web.archive.org/web/2026/https://onlinelibrary.wiley.com/page/journal/17592887/homepage/forauthors.html"
  profile_version: "1.0.0"
  last_verified: "2026-05-02"
  last_verified_by: "ignorantia-engine"

taxonomy:
  review_types_accepted:
    - systematic_review_strict
    - meta_analysis
    - scoping_review
    - umbrella_review
    - mapping_study
  reporting_guidelines_endorsed:
    - PRISMA-2020
    - PRISMA-S
    - PRISMA-ScR
    - PRISMA-NMA
  methodological_standards_endorsed:
    - ICMJE
    - COPE

hard_requirements:
  length:
    unit: words
    max: 10000
    excludes: [abstract, references]
  abstract:
    max_words: 250
    structured: false
  title:
    max_words: 18
  keywords:
    min: 4
    max: 8
    controlled_vocabulary: free
  citation_style:
    format: apa-7
    references_max: null
  mandatory_sections:
    - Introduction
    - Methods
    - Results
    - Discussion
    - References
  mandatory_declarations:
    - id: conflicts_of_interest
      severity: blocking
    - id: funding
      severity: blocking
    - id: ai_usage
      severity: blocking
    - id: data_availability
      severity: major
    - id: orcid_all_authors
      severity: major
    - id: reproducibility_package_doi
      severity: major
  file_format:
    accepted: [docx]
  authorship:
    icmje_required: true
    orcid_required: corresponding_only
    credit_taxonomy_required: true
  registration:
    prospero_required: false
    osf_acceptable: true

soft_signals:
  scope_keywords:
    - meta-analysis
    - research synthesis
    - systematic review methodology
    - evidence synthesis
    - meta-research
  out_of_scope_keywords:
    - applied review without methodological contribution

scope:
  thesaurus_descriptors:
    - "Meta-Analysis [MeSH]"
    - "Research Synthesis"
