metadata:
  venue_id: emaberto_inep
  name: "Em Aberto"
  name_pt: "Em Aberto"
  publisher: "Instituto Nacional de Estudos e Pesquisas Educacionais Anísio Teixeira (Inep), MEC"
  country: BR
  language_acceptance: [pt, en, es]
  qualis_stratum: A2
  qualis_subarea: "Educacao"
  jcr_quartile: null
  sjr_quartile: null
  doaj_indexed: true
  scielo_indexed: true
  open_access: fully_oa
  apc_usd: 0
  submission_system: ojs
  source_url: "https://emaberto.inep.gov.br/ojs3/index.php/emaberto/about/submissions"
  archived_url: "https://web.archive.org/web/2026/https://emaberto.inep.gov.br/ojs3/index.php/emaberto/about/submissions"
  profile_version: "1.0.0"
  last_verified: "2026-05-02"
  last_verified_by: "ignorantia-engine"
  notes: |
    Em Aberto é periódico oficial do Inep/MEC, autarquia federal brasileira.
    Diamond OA: sem APC para autores nem leitores; CC BY-NC.
    Tradição em números monotemáticos (sub-temas educacionais relevantes para política pública).
    A2 confirmado no Qualis 2021-2024 conforme comunicado oficial do Inep (jan/2026).

taxonomy:
  review_types_accepted:
    - narrative_review
    - integrative_review
    - scoping_review
    - qualitative_synthesis
    - mapping_study
  recommended_for_layer: primary
  reporting_guidelines_endorsed:
    - PRISMA-2020
    - PRISMA-ScR
  methodological_standards_endorsed:
    - COPE
    - SciELO

hard_requirements:
  length:
    unit: words
    max: 8000
    excludes: [abstract, references, tables, figures]
  abstract:
    max_words: 200
    structured: false
  title:
    max_words: 18
  keywords:
    min: 3
    max: 5
    controlled_vocabulary: free
  citation_style:
    format: abnt-nbr-6023
    references_max: null
  mandatory_sections:
    - Introduction
    - Methods
    - Results
    - Discussion
    - References
  mandatory_declarations:
    - id: conflicts_of_interest
      severity: blocking
    - id: funding
      severity: blocking
    - id: ai_usage
      severity: blocking
    - id: orcid_corresponding_only
      severity: blocking
    - id: ethics_approval
      severity: major
  file_format:
    accepted: [docx]
  authorship:
    icmje_required: false
    orcid_required: corresponding_only
    credit_taxonomy_required: false
  registration:
    prospero_required: false
    osf_acceptable: true

ai_disclosure_policy:
  declaration_required: true
  policy_url: "https://emaberto.inep.gov.br/ojs3/index.php/emaberto"
  notes: |
    Segue diretrizes COPE/SciELO. IA pode ser ferramenta com disclosure obrigatório;
    não pode ser autor.

reproducibility:
  data_availability_statement: encouraged
  code_availability_statement: encouraged
  preprint_policy: encouraged
  registration_required_for_clinical_trials: not_applicable

oa_first_compatibility:
  full_text_oa: true
  apc_required: false
  apc_waiver_for_brazil: not_applicable
  alternative_to_paywall_for_area: true
