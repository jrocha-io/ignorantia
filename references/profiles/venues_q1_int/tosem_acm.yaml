metadata:
  venue_id: tosem_acm
  name: "ACM Transactions on Software Engineering and Methodology"
  publisher: "ACM"
  country: US
  language_acceptance: [en]
  qualis_stratum: null
  jcr_quartile: Q1
  sjr_quartile: Q1
  open_access: hybrid
  submission_system: other
  source_url: "https://dl.acm.org/journal/tosem/author-guidelines"
  archived_url: "https://web.archive.org/web/2026/https://dl.acm.org/journal/tosem/author-guidelines"
  profile_version: "1.0.0"
  last_verified: "2026-05-02"
  last_verified_by: "ignorantia-engine"

taxonomy:
  review_types_accepted:
    - systematic_review_strict
    - mapping_study
    - meta_analysis
  reporting_guidelines_endorsed:
    - PRISMA-2020
    - SIGSOFT-EMP-STANDARDS
  methodological_standards_endorsed:
    - ICMJE
    - COPE
    - "ACM Code of Ethics"
    - "ACM Artifact Review and Badging"

hard_requirements:
  length:
    unit: pages
    max: 35
    excludes: [references]
  abstract:
    max_words: 250
    structured: false
  title:
    max_words: 16
  keywords:
    min: 4
    max: 8
    controlled_vocabulary: ACM-CCS-2012
  citation_style:
    format: ieee
    references_max: null
  mandatory_sections:
    - Introduction
    - Background
    - Methods
    - Results
    - Discussion
    - Threats to Validity
    - Related Work
    - Conclusion
    - References
  mandatory_declarations:
    - id: conflicts_of_interest
      severity: blocking
    - id: funding
      severity: blocking
    - id: ai_usage
      severity: blocking
    - id: data_availability
      severity: blocking
    - id: orcid_all_authors
      severity: major
    - id: reproducibility_package_doi
      severity: major
  file_format:
    accepted: [tex]
    template_url: "https://www.acm.org/publications/proceedings-template"
  authorship:
    icmje_required: true
    orcid_required: all
    credit_taxonomy_required: false
  registration:
    prospero_required: false
    osf_acceptable: true

soft_signals:
  scope_keywords:
    - software engineering methodology
    - software process
    - software tools
    - empirical software engineering
    - software metrics

scope:
  thesaurus_descriptors:
    - "Software engineering [ACM CCS]"
    - "Software notations and tools [ACM CCS]"
