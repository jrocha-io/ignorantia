  notes: |
    Computational and Applied Mathematics (COAM) é periódico oficial da SBMAC, co-publicado pela Springer Nature.
    Qualis A2 PROVÁVEL em Matemática/Probabilidade e Estatística no 2021-2024.
    Confirmação Sucupira por ISSN 1807-0302 mandatória.
    HYBRID OA com APC USD 3.290 para Open Choice. Subscription-only se autor não pagar.
    Tier-3 do esquema OA-first: Springer hybrid alto-custo. FALLBACK declarado.
    Companion ao TCAM (também SBMAC, mas TCAM é diamond OA tier-1).
    Foco em matemática aplicada e computacional; aceita survey papers metodológicos.
    Inglês obrigatório.

