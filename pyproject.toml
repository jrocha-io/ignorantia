[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ignorantia"
version = "3.0.0"
description = "Skill para revisões sistemáticas de literatura PRISMA-2020"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-4.0"
authors = [{ name = "José Rocha", email = "jrocha.developer@gmail.com" }]
keywords = [
    "systematic-literature-review",
    "prisma-2020",
    "academic-research",
    "open-access",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "click>=8.1",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.8",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "hypothesis>=6.92",
]
docx = ["python-docx>=1.0"]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]
all = ["ignorantia[dev,docx,docs]"]

[project.scripts]
ignorantia = "ignorantia.interface.cli.main:cli"

[project.urls]
Repository = "https://github.com/jrocha-io/ignorantia"
Issues = "https://github.com/jrocha-io/ignorantia/issues"
Changelog = "https://github.com/jrocha-io/ignorantia/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ignorantia"]

[tool.hatch.build.targets.sdist]
include = ["src/ignorantia", "README.md", "LICENSE", "CHANGELOG.md"]

# ----------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests", "scripts/comparison/tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: fast, isolated tests of single classes/functions (<5s total)",
    "integration: tests that compose 2+ classes (<30s)",
    "e2e: end-to-end tests with subprocess and filesystem (<2min)",
    "contract: schema/property-based tests using hypothesis",
]
filterwarnings = [
    "error::DeprecationWarning:ignorantia",
]

# ----------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Legacy code under scripts/ is linted progressively as it migrates into src/
# during phases F1-F7. Tests under tests/integration/ and tests/e2e/ predate v3
# and are excluded from the strict ruleset here; they will be re-linted as the
# code they cover is migrated and rewritten.
extend-exclude = ["scripts", "tests/integration", "tests/e2e"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "N",    # pep8-naming
    "D",    # pydocstyle
    "S",    # bandit (security)
    "TID",  # flake8-tidy-imports
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (commented-out code)
]
ignore = [
    "D100",  # missing docstring in public module
    "D104",  # missing docstring in public package
    "D203",  # 1 blank line before class docstring (conflicts with D211)
    "D213",  # multi-line summary on second line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",       # docstrings not required in tests
    "S101",    # asserts allowed
    "ARG",     # unused fixture args allowed
]
"src/ignorantia/__init__.py" = ["D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ----------------------------------------------------------------------
# mypy
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_decorators = true
disallow_any_generics = true
no_implicit_reexport = true
files = ["src/ignorantia"]
exclude = ["scripts/", "tests/"]

# Legacy scripts/ uses dynamic patterns (sys.path injection). Strict typing
# is applied progressively as code migrates from scripts/ into src/.
[[tool.mypy.overrides]]
module = "scripts.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["pytest", "hypothesis", "hypothesis.*", "docx", "docx.*", "click", "click.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true

# Click decorators erase function type information under
# ignore_missing_imports — untyped-decorator fires on every @click
# call. The interface/cli module is the *only* place we use Click,
# and its public surface is the CliRunner-driven test suite, so we
# accept untyped decorators locally and keep the rest of the project
# strict.
[[tool.mypy.overrides]]
module = ["ignorantia.interface.cli.*"]
disallow_untyped_decorators = false

# ----------------------------------------------------------------------
# coverage
# ----------------------------------------------------------------------
[tool.coverage.run]
source = ["src/ignorantia"]
branch = true
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# ----------------------------------------------------------------------
# bandit (security)
# ----------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", "scripts"]
# B405/B314: We parse XML from controlled, HTTPS-served sources
# (export.arxiv.org Atom; VuFind RSS at lareferencia.info, bdtd.ibict.br).
# The HTTPS channel guarantees integrity against MITM injection of
# malicious XML, so the XXE/billion-laughs class of attacks bandit warns
# about does not apply. Switching to ``defusedxml`` would be the
# belt-and-braces hardening; tracked as v3.0.0 follow-up.
skips = ["B405", "B314"]
