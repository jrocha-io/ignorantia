metadata:
  venue_id: err_elsevier
  name: "Educational Research Review"
  publisher: "Elsevier"
  country: NL
  language_acceptance: [en]
  qualis_stratum: null
  jcr_quartile: Q1
  sjr_quartile: Q1
  open_access: hybrid
  submission_system: editorial_manager
  source_url: "https://www.sciencedirect.com/journal/educational-research-review/publish/guide-for-authors"
  archived_url: "https://web.archive.org/web/2026/https://www.sciencedirect.com/journal/educational-research-review/publish/guide-for-authors"
  profile_version: "1.0.0"
  last_verified: "2026-05-02"
  last_verified_by: "ignorantia-engine"

taxonomy:
  review_types_accepted:
    - systematic_review_strict
    - meta_analysis
    - scoping_review
    - umbrella_review
  reporting_guidelines_endorsed:
    - PRISMA-2020
    - PRISMA-S
    - PRISMA-ScR
  methodological_standards_endorsed:
    - ICMJE
    - COPE

hard_requirements:
  length:
    unit: words
    max: 10000
    excludes: [abstract, references]
  abstract:
    max_words: 250
    structured: false
  title:
    max_words: 18
  keywords:
    min: 3
    max: 6
    controlled_vocabulary: ERIC
  citation_style:
    format: apa-7
    references_max: null
  mandatory_sections:
    - Introduction
    - Method
    - Results
    - Discussion
    - References
  mandatory_declarations:
    - id: prospero_registration
      severity: major
    - id: conflicts_of_interest
      severity: blocking
    - id: funding
      severity: blocking
    - id: ai_usage
      severity: blocking
    - id: data_availability
      severity: major
    - id: orcid_all_authors
      severity: major
  file_format:
    accepted: [docx]
  authorship:
    icmje_required: true
    orcid_required: corresponding_only
    credit_taxonomy_required: true
  registration:
    prospero_required: false
    osf_acceptable: true

soft_signals:
  scope_keywords:
    - educational research
    - learning sciences
    - educational psychology
    - curriculum
    - assessment
    - educational technology
    - teacher education

scope:
  thesaurus_descriptors:
    - "Education [ERIC]"
    - "Learning [ERIC]"
    - "Educational Research [ERIC]"
