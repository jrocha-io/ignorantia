  notes: |
    Pesquisa Operacional (POPE) é periódico oficial da SOBRAPO (sociedade científica brasileira).
    A2 PROVÁVEL no Qualis 2021-2024 (área-mãe Engenharias III) — era A2 em 2017-2020.
    Confirmação Sucupira por ISSN 1678-5142 mandatória.
    Diamond OA via SciELO: sem APC; CC BY.
    Inglês obrigatório desde >2010.
    DESTAQUE: Declaração editorial explícita aceita "revisões bibliográficas e trabalhos
    sobre metodologia da PO" — único venue brasileiro de Engenharias com aceite explícito de revisões.


    ---
    v2.3 RECALIBRAÇÃO: estrato ajustado de A2 para A3 conforme Pesquisa Qualis 2021-2024. Trajetória B1/B2 em Engenharias e CC (2017-2020); CiteScore Scopus ~1.4. FORTEMENTE PROVÁVEL A3 ou A4 em 2021-2024 dependendo do recorte por área. Registrado conservadoramente como A3.
