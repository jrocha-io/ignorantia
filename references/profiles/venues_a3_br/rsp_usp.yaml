taxonomy:
  review_types_accepted:
    - systematic_review_strict
    - systematic_review_with_2_reviewers
    - meta_analysis
    - scoping_review
    - rapid_review
  reporting_guidelines_endorsed:
    - PRISMA-2020
    - PRISMA-S
    - PRISMA-ScR
    - MOOSE
    - CONSORT-2010
    - STARD-2015
    - STROBE
  methodological_standards_endorsed:
    - ICMJE
    - COPE

hard_requirements:
  length:
    unit: words
    max: 4000
    excludes: [abstract, references, tables, figures]
  abstract:
    max_words: 300
    structured: true
    structure_headings: [Objective, Methods, Results, Conclusions]
  title:
    max_words: 18
  keywords:
    min: 3
    max: 6
    controlled_vocabulary: MeSH
  citation_style:
    format: vancouver_superscript
    references_max: null
  mandatory_sections:
    - Introduction
    - Methods
    - Results
    - Discussion
    - References
  mandatory_declarations:
    - id: ethics_approval
      severity: blocking
    - id: conflicts_of_interest
      severity: blocking
    - id: funding
      severity: blocking
    - id: orcid_corresponding_only
      severity: major
    - id: ai_usage
      severity: major
    - id: data_availability
      severity: major
  file_format:
    accepted: [docx, doc]
  figures:
    max_count: 5
  authorship:
    icmje_required: true
    orcid_required: corresponding_only
    credit_taxonomy_required: false
  registration:
    prospero_required: false
    osf_acceptable: true

soft_signals:
  scope_keywords:
    - public health
    - epidemiology
    - health policy
    - health services
    - saúde pública
    - epidemiologia
    - políticas de saúde
  out_of_scope_keywords:
    - laboratory only
    - veterinary

scope:
  thesaurus_descriptors:
    - "Public Health [MeSH]"
    - "Health Services [MeSH]"
    - "Epidemiology [MeSH]"
  areas_qualis:
    - "Saúde Coletiva (área 22)"
  excluded_topics: []
