  notes: |
    JCAES é periódico oficial da SBA (Sociedade Brasileira de Automática), co-publicado pela Springer Nature.
    Qualis A2 PROVÁVEL em Engenharias IV (Elétrica/Biomédica) no 2021-2024; pode ter sido B1 em alguma área-irmã.
    Confirmação Sucupira por ISSN 2195-3899 mandatória.
    HYBRID OA com APC USD 3.460 para Open Choice — alto custo. Subscription-only se autor não pagar.
    Tier-3 do esquema OA-first: Springer hybrid alto-custo. Listado como FALLBACK declarado.
    Aceita tutorials e survey papers; SLR formal não-explicitamente aceito mas surveys metodológicos passam.
    Inglês obrigatório.

