name: CI

on:
  push:
    # Push trigger inclui feature/** para que branches sem PR aberta (e.g.
    # cherry-picks pós-merge) gerem checks visíveis na página /branches/active.
    # ``concurrency: cancel-in-progress`` abaixo evita acúmulo de runs em
    # WIP rápido.
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop, "feature/**"]

concurrency:
  # Include event_name in the group so the push and pull_request triggers
  # do NOT cancel each other (they fire in parallel for any branch with
  # an open PR; the prior shared group was recording cancellations as
  # job-level "failures" that surfaced in <15 seconds with no step
  # output — Fix 18 phase 8 / RS-42 dogfood).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.5"
      - name: Run ruff check
        run: ruff check src tests
      - name: Run ruff format check
        run: ruff format --check src tests

  typecheck:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev deps
        run: pip install -e ".[dev]"
      - name: Run mypy
        run: mypy

  security:
    name: Security (bandit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade pip itself
        # Pip-audit scans installed packages including pip; older pip on
        # the runner ships with CVEs (e.g. CVE-2026-3219). Upgrading pip
        # before the audit keeps the gate focused on *our* dependencies.
        run: python -m pip install --upgrade pip
      - name: Install security tools
        run: pip install "bandit>=1.7" "pip-audit>=2.7"
      - name: Run bandit
        run: bandit -r src -c pyproject.toml
      - name: Run pip-audit
        # --skip-editable is required because we install ignorantia via
        # `pip install -e .`. pip-audit >=2.10 errors out under --strict
        # when an editable package can't be resolved on PyPI; we audit
        # only third-party dependencies, not the package under
        # development.
        run: pip-audit --strict --skip-editable

  test:
    name: Test (pytest, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dev deps
        run: pip install -e ".[dev,docx]"
      - name: Run pytest with coverage
        run: pytest --cov --cov-report=xml --cov-report=term
      - name: Upload coverage artifact
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
