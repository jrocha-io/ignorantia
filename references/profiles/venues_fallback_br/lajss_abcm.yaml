  notes: |
    Latin American Journal of Solids and Structures (LAJSS) é periódico oficial da ABCM.
    Qualis A2 PROVÁVEL no quadriênio 2021-2024 em Engenharias I (Civil/Sanitária/Transportes); A2 em 2017-2020.
    Confirmação Sucupira por ISSN 1679-7825 mandatória.
    Open access via SciELO MAS COBRA APC: EUR 600-1200 conforme tipo do artigo (declaração no site).
    Tier-2 do esquema OA-first do ignorantia: APC modesto declarado, publisher comunitário científico (ABCM).
    Aceita review papers (não SLR formal); reviews retrospectivos e methodological reviews aceitos.
    Inglês obrigatório.

