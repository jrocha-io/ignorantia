  notes: |
    São Paulo Journal of Mathematical Sciences (SPJMS) é periódico do IME-USP, co-publicado pela Springer Nature desde 2015.
    Qualis A2/A3 PROVÁVEL em Matemática/Probabilidade e Estatística no 2021-2024.
    Confirmação Sucupira por ISSN 2316-9028 mandatória.
    HYBRID OA com APC USD 3.290 para Open Choice. Subscription-only se autor não pagar.
    Tier-3 do esquema OA-first: Springer hybrid alto-custo. FALLBACK declarado.
    Aceita expository surveys e research papers; sem foco específico em SLR formal.
    Inglês obrigatório.

