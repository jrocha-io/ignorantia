  notes: |
    Brazilian Journal of Physics (BJP) é periódico oficial da SBF, co-publicado pela Springer Nature desde 2010.
    Qualis A2 PROVÁVEL em Astronomia/Física no 2021-2024.
    Confirmação Sucupira por ISSN 1678-4448 mandatória.
    HYBRID OA com APC USD 3.290 para Open Choice. Subscription-only se autor não pagar.
    Tier-3 do esquema OA-first: Springer hybrid alto-custo. FALLBACK declarado.
    Distinto da RBEF (Revista Brasileira de Ensino de Física), que é diamond mas área-mãe Ensino.
    Aceita review articles e topical reviews; SLR formal não é tipo padrão.
    Inglês obrigatório.

