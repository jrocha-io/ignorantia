  notes: |-
    Q2 SJR e Q2 JCR Education (referência: Researcher.Life e Scimago JR).
    Fully OA com APC ~USD 1.620 (£1.295) — APC moderado para Q2 internacional.
    Tier 2: APC ≤ USD 2.000; publisher comunitário científico via T&F Cogent OA program.
    Aceita systematic and scholarly reviews. PRISMA-2020 para SLRs; CONSORT; STROBE.
    Política T&F Generative AI explícita (uso permitido com declaração; LLMs não podem ser autores).
    Discount via Read & Publish T&F para autores com filiação institucional elegível pode reduzir APC.
