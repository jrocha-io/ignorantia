  notes: |
    Bulletin of the Brazilian Mathematical Society é periódico oficial da SBM, co-publicado pela Springer Nature.
    Nova série desde 2002 (substituiu o Boletim antigo).
    Qualis A2 PROVÁVEL em Matemática/Probabilidade e Estatística no 2021-2024.
    Confirmação Sucupira por ISSN 1678-7714 mandatória.
    HYBRID OA com APC USD 3.290 para Open Choice. Subscription-only se autor não pagar.
    Tier-3 do esquema OA-first: Springer hybrid alto-custo. FALLBACK declarado.
    Aceita expository surveys de qualidade excepcional; SLR formal não é tipo padrão.
    Inglês obrigatório.

