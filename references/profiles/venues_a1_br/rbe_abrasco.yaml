metadata:
  venue_id: rbe_abrasco
  name: "Revista Brasileira de Epidemiologia"
  name_pt: "Revista Brasileira de Epidemiologia"
  publisher: "Associação Brasileira de Saúde Coletiva (Abrasco)"
  country: BR
  language_acceptance: [pt, en]
  qualis_stratum: A2
  qualis_subarea: "QR1-Vida+Saude"
  jcr_quartile: Q3
  sjr_quartile: Q2
  doaj_indexed: true
  scielo_indexed: true
  open_access: fully_oa
  apc_usd: 0
  submission_system: ojs
  source_url: "https://www.scielo.br/journal/rbepid/about/"
  archived_url: "https://web.archive.org/web/2026/https://www.scielo.br/journal/rbepid/"
  profile_version: "1.0.0"
  last_verified: "2026-05-02"
  last_verified_by: "ignorantia-engine"
  notes: |
    RBE é periódico da Abrasco (sociedade científica brasileira de saúde coletiva).
    A2 PROVÁVEL no Qualis 2021-2024 (área-mãe Saúde Coletiva) — era A2/A1 em 2017-2020
    dependendo da subárea de avaliação; confirmação Sucupira (ISSN 1980-5497) é mandatória.
    Diamond OA: sem APC; CC BY 4.0.
    Forte foco em PRISMA-2020 obrigatório para SR e MOOSE para SR de estudos observacionais.

taxonomy:
  review_types_accepted:
    - systematic_review_strict
    - systematic_review_with_2_reviewers
    - scoping_review
    - meta_analysis
    - narrative_review
  recommended_for_layer: all
  reporting_guidelines_endorsed:
    - PRISMA-2020
    - PRISMA-S
    - MOOSE
  methodological_standards_endorsed:
    - ICMJE
    - COPE

hard_requirements:
  length:
    unit: words
    max: 4000
    excludes: [abstract, references, tables, figures]
  abstract:
    max_words: 250
    structured: true
    structure_headings: [Objective, Methods, Results, Conclusion]
  title:
    max_words: 18
  keywords:
    min: 3
    max: 6
    controlled_vocabulary: DeCS
  citation_style:
    format: vancouver
    references_max: null
  mandatory_sections:
    - Introduction
    - Methods
    - Results
    - Discussion
    - References
  mandatory_declarations:
    - id: conflicts_of_interest
      severity: blocking
    - id: funding
      severity: blocking
    - id: ai_usage
      severity: blocking
    - id: orcid_corresponding_only
      severity: blocking
    - id: ethics_approval
      severity: blocking
    - id: prospero_registration
      severity: blocking
      detection_anchors: ["CRD\\d{6,9}", "PROSPERO"]
    - id: trial_registration
      severity: major
  file_format:
    accepted: [docx]
  authorship:
    icmje_required: true
    orcid_required: all
    credit_taxonomy_required: true
  registration:
    prospero_required: true
    osf_acceptable: true

ai_disclosure_policy:
  declaration_required: true
  policy_url: "https://www.scielo.br/journal/rbepid/about/"
  notes: |
    Segue diretrizes SciELO. IA com disclosure obrigatório.

reproducibility:
  data_availability_statement: required
  code_availability_statement: encouraged
  preprint_policy: encouraged
  registration_required_for_clinical_trials: true

oa_first_compatibility:
  full_text_oa: true
  apc_required: false
  apc_waiver_for_brazil: not_applicable
  alternative_to_paywall_for_area: true
